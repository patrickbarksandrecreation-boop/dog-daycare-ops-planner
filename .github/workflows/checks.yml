name: Planner checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:edge
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/petboost/smoke.mjs
      - run: pnpm --package=netlify-cli@27.12.1 dlx netlify functions:build --src netlify/functions --functions .netlify/functions
      - run: pnpm test:e2e
      - run: pnpm test:pwa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
