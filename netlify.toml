[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--frozen-lockfile"

[functions]
  node_bundler = "esbuild"

[functions."petboost-run-background"]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions."petboost-verify-background"]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[functions."petboost-login-background"]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]


# Existing files take precedence. Browser deep links return the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite names these files by content hash. HTML and sw.js must revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/petboost-reconnect*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Runs only after production publication; dispatches the existing protected
# read-only check using server-side secrets, never a browser-visible key.
[[plugins]]
  package = "./netlify/plugins/petboost-verify"
  [plugins.inputs]
    verification_id = "dd583655-5cf6-43f4-8576-e2e6019aa9c1"
